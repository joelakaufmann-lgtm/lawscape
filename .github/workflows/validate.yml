name: Validate

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run tests
        run: npm test
      - name: Build portable site
        run: npm run build
      - name: Validate deployable package
        run: npm run release:check
