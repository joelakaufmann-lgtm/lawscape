// ---------------------------------------------------------------- palette
const C = { bg: '#0b1220', bg2: '#101a2e', gold: '#d9b76a', goldDim: '#9c8248', cream: '#f4ead8', ink: '#0a0f1a', muted: '#9aa3b2', green: '#7ccf8a', red: '#e96a62', navy: '#1f3a5f', brass: '#b8912f' };

// ---------------------------------------------------------------- bitmap pixel font (original 5x7 glyphs)
const GLYPHS = {

  U: ['10001', '10001', '10001', '10001', '10001', '10001', '01110'], V: ['10001', '10001', '10001', '10001', '10001', '01010', '00100'],
  W: ['10001', '10001', '10001', '10101', '10101', '10101', '01010'], X: ['10001', '10001', '01010', '00100', '01010', '10001', '10001'],
  Y: ['10001', '10001', '01010', '00100', '00100', '00100', '00100'], Z: ['11111', '00001', '00010', '00100', '01000', '10000', '11111'],
  0: ['01110', '10001', '10011', '10101', '11001', '10001', '01110'], 1: ['00100', '01100', '00100', '00100', '00100', '00100', '01110'],
  2: ['01110', '10001', '00001', '00010', '00100', '01000', '11111'], 3: ['11110', '00001', '00001', '01110', '00001', '00001', '11110'],
  4: ['00010', '00110', '01010', '10010', '11111', '00010', '00010'], 5: ['11111', '10000', '11110', '00001', '00001', '10001', '01110'],
  6: ['00110', '01000', '10000', '11110', '10001', '10001', '01110'], 7: ['11111', '00001', '00010', '00100', '01000', '01000', '01000'],
  8: ['01110', '10001', '10001', '01110', '10001', '10001', '01110'], 9: ['01110', '10001', '10001', '01111', '00001', '00010', '01100'],
  ' ': ['00000', '00000', '00000', '00000', '00000', '00000', '00000'], '.': ['00000', '00000', '00000', '00000', '00000', '01100', '01100'],

  '/': ['00001', '00010', '00010', '00100', '01000', '01000', '10000'], '&': ['01100', '10010', '10100', '01000', '10101', '10010', '01101'],
  "'": ['00100', '00100', '01000', '00000', '00000', '00000', '00000'], '!': ['00100', '00100', '00100', '00100', '00100', '00000', '00100'],
  ':': ['00000', '01100', '01100', '00000', '01100', '01100', '00000'], '+': ['00000', '00100', '00100', '11111', '00100', '00100', '00000'],
  '·': ['00000', '00000', '00000', '01100', '01100', '00000', '00000'], '§': ['01110', '10000', '01110', '10001', '01110', '00001', '01110'],
  '(': ['00010', '00100', '01000', '01000', '01000', '00100', '00010'], ')': ['01000', '00100', '00010', '00010', '00010', '00100', '01000'],
  '>': ['10000', '01000', '00100', '00010', '00100', '01000', '10000'], '?': ['01110', '10001', '00001', '00110', '00100', '00000', '00100'],
  '%': ['11001', '11010', '00010', '00100', '01000', '01011', '10011'], '$': ['00100', '01111', '10100', '01110', '00101', '11110', '00100'],
};
function pixWidth(s, cell) { return s.length * 6 * cell - cell; }
// Draw upper-case bitmap text. cell = size of one pixel. Text is snapped to whole cells for crisp edges.
function pix(s, x, y, cell = 8, color = C.cream, { align = 'left', shadow = C.ink, glow = null } = {}) {
  s = String(s).toUpperCase();
  const w = pixWidth(s, cell);
  let ox = Math.round(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x), oy = Math.round(y);
  const draw = (dx, dy, col) => {
    ctx.fillStyle = col;
    let cx = ox + dx;
    for (const ch of s) {
      const g = GLYPHS[ch] || GLYPHS['?'];
      for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++) if (g[r][c] === '1') ctx.fillRect(cx + c * cell, oy + dy + r * cell, cell, cell);
      cx += 6 * cell;
    }
  };
  if (glow) { ctx.save(); ctx.shadowColor = glow; ctx.shadowBlur = cell * 3; draw(0, 0, color); ctx.restore(); }
  if (shadow) draw(cell, cell, shadow);
  draw(0, 0, color);
  return w;
}

// ---------------------------------------------------------------- live world views (real renderer, zoomed)
function makeWorld(zoom) {
  const c = document.createElement('canvas'); c.className = 'world';
  c.style.width = `${W / zoom}px`; c.style.height = `${H / zoom}px`; document.body.appendChild(c);
  const r = new WorldRenderer(c); c.width = W; c.height = H; r.dpr = zoom;
  return { canvas: c, renderer: r, zoom };
}
const worldA = makeWorld(2.2), worldB = makeWorld(2.0), worldS = makeWorld(1.8), worldT = makeWorld(2.1);
const playerLook = appearanceLook({ skin: 3, hair: 6, hairStyle: 7, eye: 2, glasses: true, suitColor: '#1f3a5f', tieColor: '#b8912f', shirtColor: '#f3eee1' });
function npcsOf(zone) { return (zone.npcs || []).map((def) => ({ def, actor: new Actor(def.x, def.y, def.look, { npc: def }) })); }
const npcCache = {};
function zoneNpcs(id) { return npcCache[id] ??= npcsOf(ZONES[id]); }
// Deterministic walk: re-simulate from the scene start every frame so renders never depend on call order.
function walker(start, path, speed, elapsed) {
  const a = new Actor(start.x, start.y, playerLook, { speed });
  a.setPath(path.map((p) => ({ ...p })));
  const steps = Math.floor(elapsed * FPS);
  for (let i = 0; i < steps; i++) a.update(1 / FPS);
  return a;
}
// Renders a zone into a world view and returns a function mapping grid coords to film coords.
function renderWorld(view, zoneId, player, t, ox = 0) {
  const zone = ZONES[zoneId];
  view.renderer.render(zone, player, zoneNpcs(zoneId), null, t);
  const cam = view.renderer.cam, z = view.zoom;
  return (gx, gy, dy = 0) => { const s = gridToScreen(gx, gy); return { x: (s.x + cam.x) * z + ox, y: (s.y + cam.y + dy) * z }; };
}
function drawWorld(view, x = 0, y = 0, w = W, h = H) { ctx.drawImage(view.canvas, x, y, w, h); }

// ---------------------------------------------------------------- shared decor
function backdrop(t, variant = 0) {
  rect(0, 0, W, H, variant ? C.bg2 : C.bg);
  ctx.save(); ctx.translate(960, 640); ctx.scale(1, .5); ctx.rotate(Math.PI / 4);
  ctx.strokeStyle = 'rgba(130,150,180,.06)'; ctx.lineWidth = 2;
  const off = (t * 18) % 96;
  for (let i = -24; i <= 24; i++) { ctx.beginPath(); ctx.moveTo(i * 96 + off, -2400); ctx.lineTo(i * 96 + off, 2400); ctx.stroke(); ctx.beginPath(); ctx.moveTo(-2400, i * 96 - off); ctx.lineTo(2400, i * 96 - off); ctx.stroke(); }
  ctx.restore();
}
function vignette(strength = .55) { const g = ctx.createRadialGradient(960, 540, 300, 960, 540, 1250); g.addColorStop(0, 'rgba(5,8,14,0)'); g.addColorStop(1, `rgba(5,8,14,${strength})`); rect(0, 0, W, H, g); }
function scanlines(alpha = .05) { ctx.save(); ctx.globalAlpha = alpha; ctx.fillStyle = '#000'; for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 2); ctx.restore(); }
function sparkles(t, alpha = 1, n = 40) {
  ctx.save(); ctx.globalAlpha = alpha;
  for (let i = 0; i < n; i++) {
    const x = (i * 431.7 + Math.sin(t * .4 + i) * 30 + W * 4) % W, y = (i * 137.3 - t * (10 + i % 9) * 3 + H * 40) % H;
    const a = .12 + .3 * (.5 + .5 * Math.sin(i * 5.3 + t * 2)); const s = 2 + i % 3;
    ctx.fillStyle = `rgba(217,183,106,${a})`; ctx.fillRect(Math.round(x), Math.round(y), s, s);
  }
  ctx.restore();
}
// Bottom-left location chip in pixel type, with a small brass accent.
function chip(label, sub = null, a = 1) {
  ctx.save(); ctx.globalAlpha = a;
  const cell = 5, w = Math.max(pixWidth(label, cell), sub ? pixWidth(sub, 4) : 0) + 56;
  rect(72, 940, w, sub ? 84 : 62, 'rgba(8,12,22,.92)'); rect(72, 940, 6, sub ? 84 : 62, C.gold);
  pix(label, 104, 958, cell, C.cream);
  if (sub) pix(sub, 104, 1002, 4, C.gold, { shadow: null });
  ctx.restore();
}
// Top-right build tag and bottom progress line.
function frameTag(t) {
  pix('LAWSCAPE · BETA 0.5', 1848, 40, 4, C.muted, { align: 'right', shadow: null });
  rect(0, H - 6, W, 6, 'rgba(255,255,255,.06)'); rect(0, H - 6, W * clamp(t / DUR), 6, C.gold);
}
// Callout pin: a pixel diamond marker with a parchment label.
function callout(p, label, a, side = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a;
  const lift = (1 - a) * 14;
  ctx.fillStyle = C.gold; ctx.beginPath(); ctx.moveTo(p.x, p.y - 4 + lift); ctx.lineTo(p.x + 9, p.y + 5 + lift); ctx.lineTo(p.x, p.y + 14 + lift); ctx.lineTo(p.x - 9, p.y + 5 + lift); ctx.closePath(); ctx.fill();
  ctx.font = '700 24px Georgia'; const w = ctx.measureText(label).width + 36;
  const bx = side > 0 ? p.x + 22 : p.x - 22 - w, by = p.y - 26 + lift;
  rect(bx, by, w, 46, '#f3e9d2'); rect(bx, by, w, 3, C.brass); rect(bx, by + 43, w, 3, '#8a6d2f');
  rect(side > 0 ? bx : bx + w - 4, by, 4, 46, C.brass);
  txt(label, bx + 18, by + 31, 24, '#2b2b33', { weight: 700 });
  ctx.restore();
}
function imageFit(im, x, y, w, h, { cover = false, anchorTop = false } = {}) {
  const scale = (cover ? Math.max : Math.min)(w / im.width, h / im.height), iw = im.width * scale, ih = im.height * scale;
  ctx.drawImage(im, x + (w - iw) / 2, anchorTop ? y : y + (h - ih) / 2, iw, ih); return { x: x + (w - iw) / 2, y: anchorTop ? y : y + (h - ih) / 2, w: iw, h: ih, scale };
}
// Draws a capture as a floating "window" with a drop shadow, scaled to fit the box; sw/sh crop source (px in capture space).
function windowShot(im, box, { crop = null, shadow = 60, a = 1, anchorTop = false } = {}) {
  ctx.save(); ctx.globalAlpha = a;
  const sx = crop?.x || 0, sy = crop?.y || 0, sw = crop?.w || im.width, sh = crop?.h || im.height;
  const scale = Math.min(box.w / sw, box.h / sh), dw = sw * scale, dh = sh * scale, dx = box.x + (box.w - dw) / 2, dy = anchorTop ? box.y : box.y + (box.h - dh) / 2;
  ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = shadow; ctx.shadowOffsetY = shadow / 3;
  rect(dx, dy, dw, dh, '#0a0f1a'); ctx.shadowColor = 'transparent';
  ctx.drawImage(im, sx, sy, sw, sh, dx, dy, dw, dh);
  ctx.strokeStyle = 'rgba(217,183,106,.35)'; ctx.lineWidth = 2; ctx.strokeRect(dx - 1, dy - 1, dw + 2, dh + 2);
  ctx.restore(); return { x: dx, y: dy, w: dw, h: dh, scale };
}
// Retro pointer.
function cursor(x, y, click = 0) {
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = '#fff8e9'; ctx.strokeStyle = '#0a1019'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 34); ctx.lineTo(9, 26); ctx.lineTo(15, 41); ctx.lineTo(22, 38); ctx.lineTo(16, 24); ctx.lineTo(27, 24); ctx.closePath(); ctx.fill(); ctx.stroke();
  if (click > 0) { ctx.strokeStyle = C.gold; ctx.lineWidth = 4; ctx.globalAlpha = 1 - click; ctx.beginPath(); ctx.arc(2, 2, 12 + click * 60, 0, Math.PI * 2); ctx.stroke(); }
  ctx.restore();
}
// Headline block used by feature scenes: pixel kicker, big pixel title, Georgia sub-lines.
function headline(x, y, kicker, title, lines, a, { titleCell = 11, width = 760 } = {}) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.translate(0, (1 - a) * 30);
  rect(x, y - 44, 72, 6, C.gold);
  pix(kicker, x, y - 20, 4, C.gold, { shadow: null });
  let yy = y + 30;
  for (const line of title.split('\n')) { pix(line, x, yy, titleCell, C.cream); yy += titleCell * 7 + titleCell * 2.2; }
  yy += 18;
  for (const line of lines) { ctx.font = '400 30px Georgia'; ctx.fillStyle = '#c9cfda'; ctx.textAlign = 'left'; wrap(line, x, yy, width, 40); yy += 40 * Math.ceil(ctx.measureText(line).width / width) + 8; }
  ctx.restore();
}
function wrap(s, x, y, maxW, lh) { const words = s.split(' '); let line = ''; for (const w of words) { const test = line ? line + ' ' + w : w; if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y); y += lh; line = w; } else line = test; } ctx.fillText(line, x, y); }
function bullets(x, y, items, a, lh = 46) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; items.forEach((s, i) => { const k = ease((a * items.length - i)); if (k <= 0) return; ctx.globalAlpha = a * k; pix('>', x, y + i * lh - 14, 4, C.gold, { shadow: null }); txt(s, x + 36, y + i * lh, 28, '#e3e7ee'); }); ctx.restore(); }

// ---------------------------------------------------------------- scenes
const S = { title: 0, creator: 3.0, office: 5.8, mail: 9.0, journal: 13.0, court: 15.6, sidebar: 18.0, apartment: 20.4, partners: 22.4, world: 24.0, end: 27.3 };

function sceneTitle(t) {
  const u = t - S.title;
  const p = walker({ x: 6, y: 10 }, [{ x: 6, y: 7 }, { x: 6, y: 4 }], 1.1, u);
  renderWorld(worldA, 'office', p, t); drawWorld(worldA);
  rect(0, 0, W, H, `rgba(7,11,20,${.62 + .1 * Math.sin(u)})`); vignette(.5); sparkles(t, .9);
  // Seal drops, title slams in, then the tagline.
  const drop = bounce(clamp(u / .9)); const ty = -140 + drop * 140;
  ctx.save(); ctx.translate(0, ty);
  pix('§', 960, 236, 10, C.gold, { align: 'center', glow: 'rgba(217,183,106,.8)' });
  pix('LAWSCAPE', 960, 340, 22, C.cream, { align: 'center', glow: 'rgba(217,183,106,.35)' });
  ctx.restore();
  const a2 = ease((u - .9) / .5); ctx.save(); ctx.globalAlpha = a2;
  rect(760, 545, 400, 4, C.gold);
  txt('A new way to learn legal ethics.', 960, 620, 46, '#e7e2d4', { align: 'center', style: 'italic' });
  txt('Build your practice. Explore the firm. Keep your license.', 960, 672, 28, C.muted, { align: 'center' });
  ctx.restore();
  if (u > 1.6 && Math.floor((u - 1.6) * 2.4) % 2 === 0) pix('PRESS START', 960, 800, 6, C.gold, { align: 'center' });
  chip('A LEGALQUANTS EXPERIMENT', 'FREE BROWSER RPG · NO INSTALL', a2);
  if (u < .35) rect(0, 0, W, H, `rgba(0,0,0,${1 - u / .35})`);
}

function sceneCreator(t) {
  const u = t - S.creator; backdrop(t, 1); sparkles(t, .5, 24);
  // Real creator UI on the right.
  const slide = ease(u / .55);
  windowShot(pics.creator, { x: 980 + (1 - slide) * 160, y: 70, w: 880, h: 950 }, { a: slide });

  bullets(100, 500, ['16 hairstyles, 18 hair colors, 7 facial-hair choices', 'Suits, shirts, ties, glasses and three builds', 'Preview standing, walking or seated', 'Every choice is free. None changes a grade.'], ease((u - .5) / 1.2));

    ctx.save(); ctx.globalAlpha = roster;

    pix('THE ROSTER', 120, 720, 4, C.gold, { shadow: null });
    const looks = [
      { skin: 0, hair: 2, hairStyle: 1, eye: 1, suitColor: '#6e2436', tieColor: '#1f3a5f', outfit: 'skirt' },
      { skin: 5, hair: 0, hairStyle: 11, eye: 0, suitColor: '#2b2b33', tieColor: '#b8912f', facialHair: 4 },
      { skin: 2, hair: 8, hairStyle: 9, eye: 2, suitColor: '#3f5d4b', tieColor: '#6e2436', glasses: true },
      { skin: 6, hair: 12, hairStyle: 6, eye: 0, suitColor: '#1f3a5f', tieColor: '#5c8a86', facialHair: 1, silhouette: 'relaxed' },
      { skin: 1, hair: 3, hairStyle: 3, eye: 4, suitColor: '#7a5a3a', tieColor: '#7a3b5e', outfit: 'skirt', silhouette: 'slim' },
      { skin: 4, hair: 9, hairStyle: 14, eye: 5, suitColor: '#2b2b33', tieColor: '#c8d8e6', glasses: true, faceShape: 1 },
    ];
    looks.forEach((lk, i) => {
      const a = new Actor(0, 0, appearanceLook(lk)); a.path = [{ x: 1, y: 0 }]; a.facing = i % 2 ? -1 : 1;
      ctx.save(); ctx.translate(180 + i * 128, 888); ctx.scale(1.9, 1.9); a.draw(ctx, 0, 0, t + i * .7, false); ctx.restore();
    });
    ctx.restore();
  }
  chip('CHARACTER CREATOR', 'ORIGINAL CANVAS ATTORNEYS', ease((u - .3) / .4));
}

function worldScene(t, u, { view, zone, start, path, speed, chipLabel, chipSub, pins, headlineText = null, kicker = 'LOCATION', lines = [], ox = 200 }) {
  const p = walker(start, path, speed, u);
  const OX = ox; rect(0, 0, W, H, C.bg);
  const map = renderWorld(view, zone, p, t, OX); drawWorld(view, OX, 0);
  rect(0, 0, W, H, grad(0, 0, 0, H, [[0, 'rgba(5,8,14,.35)'], [.3, 'rgba(5,8,14,0)'], [.8, 'rgba(5,8,14,0)'], [1, 'rgba(5,8,14,.5)']]));
